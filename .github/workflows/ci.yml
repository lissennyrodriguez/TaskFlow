
name: CI - TaskFlow

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: api
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependencias
        working-directory: api
        run: npm ci

      - name: Ejecutar lint
        working-directory: api
        run: npm run lint

      - name: Ejecutar pruebas
        working-directory: api
        run: npm test

  web:
    name: web
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci

      - name: Ejecutar lint
        working-directory: web
        run: npm run lint

      - name: Ejecutar pruebas
        working-directory: web
        run: npm test

      - name: Construir aplicación
        working-directory: web
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs:
      - api
      - web

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Construir imágenes Docker
        run: docker compose build
